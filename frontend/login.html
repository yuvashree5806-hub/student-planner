<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login – Study Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card card">
      <div class="auth-brand">
        <div class="brand-logo"></div>
        <div>
          <div class="brand-title">Study Planner</div>
          <div class="brand-sub">Sign in to your dashboard</div>
        </div>
      </div>

      <form id="login-form">
        <div class="form-row">
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" />
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" />
          </div>
        </div>
        <p class="auth-error" id="auth-error" role="alert"></p>
        <button type="submit" class="btn auth-submit">Sign in</button>
      </form>

      <p class="auth-footer">
        No account? <a href="register.html">Create one</a>
      </p>
    </div>
  </div>

  <script src="assets/auth.js"></script>
</body>
</html>
